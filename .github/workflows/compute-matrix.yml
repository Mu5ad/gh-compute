name: compute-matrix
on:
  workflow_dispatch:
    inputs:
      cmd_b64:
        description: script en base64
        required: true
        default: 'ZWNobyBoZWxsbzsgbnByb2M='
      shards:
        description: array JSON de shards, p.ej. [0,1,2,3]
        required: true
        default: '[0,1]'
      timeout_min:
        description: minutos maximos
        required: false
        default: '10'
jobs:
  fanout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(github.event.inputs.shards) }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: shard
        run: |
          echo "== SHARD ${{ matrix.shard }} de ${{ github.event.inputs.shards }} =="
          nproc; free -g | head -2
          export SHARD=${{ matrix.shard }}
          echo "${{ github.event.inputs.cmd_b64 }}" | base64 -d > /tmp/job.sh
          timeout "${{ github.event.inputs.timeout_min }}m" bash /tmp/job.sh 2>&1 | tail -200
