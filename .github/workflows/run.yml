name: compute
on:
  workflow_dispatch:
    inputs:
      cmd_b64:
        description: script en base64
        required: true
        default: 'ZWNobyBoZWxsbzsgbnByb2M='
      timeout_min:
        description: minutos maximos
        required: false
        default: '10'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: entorno
        run: |
          echo "== RUNNER =="; nproc; free -g; df -h / | tail -1; uname -a
          echo "== TOOLS =="; python3 -V; ffmpeg -version 2>/dev/null | head -1 || true
      - name: ejecutar
        run: |
          echo "${{ github.event.inputs.cmd_b64 }}" | base64 -d > /tmp/job.sh
          echo "== SCRIPT =="; cat /tmp/job.sh
          echo "== SALIDA =="
          timeout "${{ github.event.inputs.timeout_min }}m" bash /tmp/job.sh 2>&1 | tail -400
